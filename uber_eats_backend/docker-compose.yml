services:
  customers:
    build: .
    container_name: uber_customers
    volumes:
      - .:/app
    ports:
      - "8001:8000" # Map port 8000 in the container to 8001 on localhost
    environment:
      - DEBUG=True
    networks:
      - app_network

  order:
    build: .
    container_name: uber_order
    volumes:
      - .:/app
    ports:
      - "8002:8000" # Map port 8000 in the container to 8002 on localhost
    environment:
      - DEBUG=True
    networks:
      - app_network

  restaurants:
    build: .
    container_name: uber_restaurants
    volumes:
      - .:/app
    ports:
      - "8003:8000" # Map port 8000 in the container to 8003 on localhost
    environment:
      - DEBUG=True
    networks:
      - app_network

  uber_nginx:
    image: nginx:latest
    container_name: uber_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf # Mount the Nginx config
    ports:
      - "8000:80" 
    networks:
      - app_network
    depends_on:
      - restaurants # Make sure app_a is up before Nginx starts
      - order # Make sure app_b is up before Nginx starts
      - customers

  frontend:
    build:
      context: ../uber-eats-frontend
    container_name: uber_eats_frontend
    ports:
      - "3000:80" # Expose React on port 3000
    networks:
      - app_network
    depends_on:
      - uber_nginx

networks:
  app_network: # Define the custom network
    driver: bridge
